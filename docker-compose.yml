services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint:
      - anvil
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "31337"
      - --block-base-fee-per-gas
      - "0"
      - --accounts
      - "0"
      - --mnemonic-random
    expose:
      - "8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 30

  rpc:
    image: python:3.12-alpine
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      UPSTREAM_RPC_URL: http://anvil:8545
      RPC_PROXY_PORT: "8545"
    ports:
      - "${RPC_PORT:-8545}:8545"
    volumes:
      - ./scripts/rpc_proxy.py:/app/rpc_proxy.py:ro
    command: ["python", "/app/rpc_proxy.py"]
    restart: unless-stopped

  forge:
    image: ghcr.io/foundry-rs/foundry:stable
    profiles:
      - tools
    depends_on:
      anvil:
        condition: service_healthy
    working_dir: /workspace
    environment:
      RPC_URL: http://anvil:8545
      PUBLIC_RPC_URL: ${PUBLIC_RPC_URL:-http://localhost:8545}
      RPC_PORT: "${RPC_PORT:-8545}"
      CHAIN_ID: "31337"
      DEPLOYER_PRIVATE_KEY: ${DEPLOYER_PRIVATE_KEY:-}
    volumes:
      - ./:/workspace
    entrypoint: ["/bin/sh"]
