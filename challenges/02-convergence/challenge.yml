id: 02-convergence
name: Convergence
category: blockchain
kind: blockchain_rpc
protocol: http
chain_family: evm
chain_id: 31337
rpc_internal: http://anvil:8545
description: Full convergence puzzle with backend-spawned per-user setup instances.
launcher:
  factory_contract: contracts/ChallengeFactory.sol:ChallengeFactory
  setup_contract: contracts/Setup.sol:Setup
  spawn_function: spawnFor(address)
  checker: Setup.isSolved()
  deployment_mode: static_factory
  isolation_scope: shared_chain_per_user_setup
  requires_funded_wallet: true
solver:
  file: solve.py
  env:
    - RPC_URL
    - PRIVKEY
    - SETUP_ADDR
